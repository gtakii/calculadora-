
<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <div class="calculator">
        <!-- Barra Superior -->
        <div class="top-bar">
            <button class="btn-history-toggle" id="btn-history">
                <span>🕒</span> Histórico
            </button>
            <div class="theme-switcher">
                <button class="theme-btn" id="theme-light">Claro</button>
                <button class="theme-btn active" id="theme-dark">Escuro</button>
            </div>
        </div>

        <!-- Painel de Histórico -->
        <div class="history-panel" id="history-panel">
            <div class="history-header">
                <span class="history-title">Histórico</span>
                <button class="btn-clear-history" id="btn-clear-history">Limpar</button>
            </div>
            <div class="history-list" id="history-list">
                <div class="history-empty">Nenhum cálculo registrado</div>
            </div>
        </div>

        <!-- Visor -->
        <div class="display">
            <div class="expression" id="expression-display"></div>
            <div class="current-value" id="main-display">0</div>
        </div>

        <!-- Teclado -->
        <div class="keypad">
            <button class="btn btn-op" data-action="clear">C</button>
            <button class="btn btn-op" data-action="backspace">⌫</button>
            <button class="btn btn-op" data-operator="/">÷</button>
            <button class="btn btn-op" data-operator="*">×</button>

            <button class="btn btn-num" data-number="7">7</button>
            <button class="btn btn-num" data-number="8">8</button>
            <button class="btn btn-num" data-number="9">9</button>
            <button class="btn btn-op" data-operator="-">-</button>

            <button class="btn btn-num" data-number="4">4</button>
            <button class="btn btn-num" data-number="5">5</button>
            <button class="btn btn-num" data-number="6">6</button>
            <button class="btn btn-op" data-operator="+">+</button>

            <button class="btn btn-num" data-number="1">1</button>
            <button class="btn btn-num" data-number="2">2</button>
            <button class="btn btn-num" data-number="3">3</button>
            <button class="btn btn-action" data-action="calculate">=</button>

            <button class="btn btn-num col-span-2" data-number="0">0</button>
            <button class="btn btn-num" data-number=".">,</button>
        </div>
    </div>

</body>
</html>
